<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Pickwise — статистика сайта</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0c;color:#e6e6e6;font-family:Manrope,system-ui,sans-serif}
main{width:min(560px,100% - 32px);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font:700 28px "Space Grotesk",sans-serif;color:#f4f4f4}
.c{padding:24px;border-radius:20px;border:1px solid #2a2a2c;background:#121214}
.c small{display:block;color:#8a8a8e;font-size:13px}
.c b{display:block;margin-top:6px;font:700 52px "Space Grotesk",sans-serif;color:#f4f4f4}
p{margin:0;font-size:13px;line-height:1.6;color:#77777b}
a{color:#cfcfcf}
</style>
</head>
<body>
<main>
  <h1>Статистика Pickwise</h1>
  <div class="c"><small>Скачали программу (люди, по одному на браузер)</small><b id="dl">…</b></div>
  <div class="c"><small>Открыли сайт (уникальные посетители)</small><b id="vis">…</b></div>
  <p>Считаются только скачивания с сайта. Автообновления самой программы сюда не попадают. Счётчик сбрасывается, если к нему не обращаться полгода. <a href="./">← на сайт</a></p>
</main>
<script>
const NS = 'pickwise-ttls-site', C = 'https://abacus.jasoncameron.dev/get/' + NS + '/';
const show = (id, key) => fetch(C + key).then(r => r.ok ? r.json() : { value: 0 }).then(j => document.getElementById(id).textContent = (j.value || 0).toLocaleString('ru-RU')).catch(() => document.getElementById(id).textContent = '—');
show('dl', 'downloads'); show('vis', 'visitors');
</script>
</body>
</html>
