# Refreshes the shared pro-game database (db/) a few times a day, so Pickwise users
# download one small file from GitHub instead of each crawling gol.gg.
name: Pro games database
on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:
  push:
    paths: ["tools/pwsync"]
permissions:
  contents: write
concurrency:
  group: db
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Check gol.gg
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -A "Mozilla/5.0" https://gol.gg/tournament/list/ || echo "no answer")
          echo "::notice::gol.gg answered: $code"
      - name: Sync from gol.gg
        run: |
          chmod +x tools/pwsync
          set -o pipefail
          ./tools/pwsync --export-db db 2>&1 | tee sync.log || { echo "::error::$(tail -n 4 sync.log | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(tail -n 2 sync.log | tr '\n' ' ')"
      - name: Commit
        run: |
          git config user.name "pickwise-bot"
          git config user.email "pickwise-bot@users.noreply.github.com"
          git add db
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Pro games database $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
